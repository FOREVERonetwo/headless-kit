name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build --workspace @headless-kit/vue
      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./packages/headless/package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json is $VERSION but the tag is $TAG"
            exit 1
          fi
      - run: npm publish --workspace @headless-kit/vue --provenance --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/FOREVERonetwo/headless-kit/blob/main/CHANGELOG.md)
            for the full list of changes.
